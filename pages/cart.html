<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK commerce site</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css">
    <link href="../src/output.css" rel="stylesheet">
</head>

<body>
    <div class="absolute inset-0 max-h-screen w-full bg-black/60 z-50 hidden confirmed ">
        <div class="middeltext">
            <h1 class="text-4xl bg-green-300  p-5 rounded-3xl">تم تاكيد المنتجات بنجاح <i class="fa-solid fa-check"></i>
            </h1>

        </div>
    </div>
    <header id="header"></header>
    <section class="py-5">
        <div class="lg:grid lg:grid-cols-3 flex flex-col">
            <div id="displaycart" class="col-span-2">


            </div>
            <div class="border">
                <div id="displaytotal">

                </div>

                <div class="p-4">
                    <form action="" id="buyconfirm">
                        <label for="">اكتب الاسم</label>
                        <input required type="text" class="input" placeholder=" الاسم هنا">
                        <label for="">اكتب رقم الهاتف</label>
                        <input required type="text" class="input" placeholder=" رقم الهاتف هنا">
                        <label for="">اكتب العنوان</label>
                        <input required type="text" class="input" placeholder=" العنوان هنا">
                        <button type="submit" onclick="buyconfirm()"
                            class="p-3 rounded-xl mt-5 bg-blue-400 w-full  font-bold hover:bg-blue-900 hover:text-white">تاكيد
                            الدفع</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer id="footer">
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="../paths.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../main.js"></script>


</body>

</html>
